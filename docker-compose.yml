services:
  db:
    image: postgres:16-alpine
    container_name: riwischool-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: riwischool_plus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - riwischool-network

  api:
    build: .
    container_name: riwischool-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: riwischool_plus
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: riwischool_secret_key_2024
      JWT_EXPIRES_IN: 24h
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
    networks:
      - riwischool-network

volumes:
  pgdata:
  uploads:

networks:
  riwischool-network:
    driver: bridge